name: Release

# release-please keeps a release pull request up to date from Conventional Commits on main.
# Merging it bumps the version, updates CHANGELOG.md, creates the tag and the GitHub release, and
# publishes the extension. Run this workflow by hand (Actions -> Release -> Run workflow) to publish an
# existing tag again or as a pre-release.
#
# Publishing uses trusted publishing (OIDC), so no token is stored. One-time setup (docs/RELEASING.md):
#   - VS Code Marketplace: a Trusted Publishing policy for this repository, workflow "release.yml",
#     environment "release".
#   - Open VSX: a trusted publisher for this repository and workflow.
# Fallback: set the repository variable PUBLISH_AUTH to "token" and the secrets VSCE_PAT and OVSX_PAT
# in the "release" environment.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v1.3.0)
        type: string
        required: true
      pre-release:
        description: Publish as a pre-release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      PRE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.pre-release || false }}
    outputs:
      tag: ${{ env.TAG }}
      pre-release: ${{ env.PRE_RELEASE }}
      vsix: ${{ steps.pack.outputs.vsix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tag matches package.json and CHANGELOG.md
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$TAG" ] || { echo "::error::Tag $TAG does not match package.json version $v"; exit 1; }
          grep -Eq "^## \[?$v\]?" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $v"; exit 1; }
      - run: npm run check
      - run: npm test
      - id: pack
        name: Package
        run: |
          if [ "$PRE_RELEASE" = "true" ]; then npx vsce package --no-dependencies --pre-release; else npm run package; fi
          f=$(ls *.vsix)
          sha256sum "$f" > SHA256SUMS.txt
          echo "vsix=$f" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '*.vsix'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            *.vsix
            SHA256SUMS.txt

  marketplace:
    name: VS Code Marketplace
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Publish
        env:
          VSIX: ${{ needs.build.outputs.vsix }}
          PRE_RELEASE: ${{ needs.build.outputs.pre-release }}
          PUBLISH_AUTH: ${{ vars.PUBLISH_AUTH }}
          TOKEN: ${{ secrets.VSCE_PAT }}
        run: |
          args=(publish --packagePath "$VSIX")
          if [ "$PRE_RELEASE" = "true" ]; then args+=(--pre-release); fi
          if [ "$PUBLISH_AUTH" = "token" ]; then VSCE_PAT="$TOKEN" npx vsce "${args[@]}"; else npx vsce "${args[@]}" --oidc; fi

  open-vsx:
    name: Open VSX
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Publish
        env:
          VSIX: ${{ needs.build.outputs.vsix }}
          PRE_RELEASE: ${{ needs.build.outputs.pre-release }}
          PUBLISH_AUTH: ${{ vars.PUBLISH_AUTH }}
          TOKEN: ${{ secrets.OVSX_PAT }}
        run: |
          args=(publish --packagePath "$VSIX")
          if [ "$PRE_RELEASE" = "true" ]; then args+=(--pre-release); fi
          if [ "$PUBLISH_AUTH" = "token" ]; then OVSX_PAT="$TOKEN" npx ovsx "${args[@]}"; else npx ovsx "${args[@]}" --trusted-publishing; fi

  # Attaches the .vsix and its checksum to the GitHub release, even if a marketplace failed.
  github-release:
    name: GitHub release
    needs: [build, marketplace, open-vsx]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          PRE_RELEASE: ${{ needs.build.outputs.pre-release }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=(--generate-notes --verify-tag)
            if [ "$PRE_RELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${flags[@]}"
          fi
          gh release upload "$TAG" *.vsix SHA256SUMS.txt --clobber
      - name: Report marketplace failures
        if: needs.marketplace.result != 'success' || needs.open-vsx.result != 'success'
        env:
          MARKETPLACE: ${{ needs.marketplace.result }}
          OPEN_VSX: ${{ needs.open-vsx.result }}
        run: |
          echo "::error::VS Code Marketplace: $MARKETPLACE, Open VSX: $OPEN_VSX. The .vsix is attached to the release; rerun the failed job."
          exit 1
