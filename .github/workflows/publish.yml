name: Publish

# Builds the .vsix from a tag and publishes it to the VS Code Marketplace and Open VSX.
# Called by the Release workflow, or run by hand (for example for a pre-release).
#
# Marketplace authentication, in order of preference:
#   1. Microsoft Entra ID through OIDC: set the repository variables AZURE_CLIENT_ID and AZURE_TENANT_ID
#      (see docs/RELEASING.md). No long-lived secret is stored.
#   2. A Personal Access Token in the VSCE_PAT secret.
# Open VSX uses the OVSX_PAT secret. Both publish jobs run in the "release" environment, so they can
# require an approval.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      pre-release:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v1.3.0)
        type: string
        required: true
      pre-release:
        description: Publish as a pre-release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      vsix: ${{ steps.pack.outputs.vsix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tag matches package.json and CHANGELOG.md
        env:
          TAG: ${{ inputs.tag }}
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$TAG" ] || { echo "::error::Tag $TAG does not match package.json version $v"; exit 1; }
          grep -Eq "^## \[?$v\]?" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $v"; exit 1; }
      - run: npm run check
      - run: npm test
      - id: pack
        name: Package
        env:
          PRE_RELEASE: ${{ inputs.pre-release }}
        run: |
          if [ "$PRE_RELEASE" = "true" ]; then npx vsce package --no-dependencies --pre-release; else npm run package; fi
          f=$(ls *.vsix)
          sha256sum "$f" > SHA256SUMS.txt
          echo "vsix=$f" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '*.vsix'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            *.vsix
            SHA256SUMS.txt

  marketplace:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish to the VS Code Marketplace
        env:
          VSIX: ${{ needs.build.outputs.vsix }}
          PRE_RELEASE: ${{ inputs.pre-release }}
          USE_OIDC: ${{ vars.AZURE_CLIENT_ID != '' }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          args=(publish --packagePath "$VSIX")
          [ "$PRE_RELEASE" = "true" ] && args+=(--pre-release)
          [ "$USE_OIDC" = "true" ] && args+=(--azure-credential)
          npx vsce "${args[@]}"

  open-vsx:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Publish to Open VSX
        env:
          VSIX: ${{ needs.build.outputs.vsix }}
          PRE_RELEASE: ${{ inputs.pre-release }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          args=(publish --packagePath "$VSIX")
          [ "$PRE_RELEASE" = "true" ] && args+=(--pre-release)
          npx ovsx "${args[@]}"

  # Attaches the .vsix and its checksum to the GitHub release, even if one marketplace failed.
  github-release:
    needs: [build, marketplace, open-vsx]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          PRE_RELEASE: ${{ inputs.pre-release }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=(--generate-notes --verify-tag)
            [ "$PRE_RELEASE" = "true" ] && flags+=(--prerelease)
            gh release create "$TAG" "${flags[@]}"
          fi
          gh release upload "$TAG" *.vsix SHA256SUMS.txt --clobber
      - name: Report marketplace failures
        if: needs.marketplace.result != 'success' || needs.open-vsx.result != 'success'
        env:
          MARKETPLACE: ${{ needs.marketplace.result }}
          OPEN_VSX: ${{ needs.open-vsx.result }}
        run: |
          echo "::error::Marketplace: $MARKETPLACE, Open VSX: $OPEN_VSX. The .vsix is attached to the release; rerun the failed job."
          exit 1
